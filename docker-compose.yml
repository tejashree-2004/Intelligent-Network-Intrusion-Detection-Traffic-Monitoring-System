services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    volumes:
      - ./database:/app/database

  dashboard:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
